name: Prompt Library Validation

on:
  push:
    branches: ["production-candidate-v1"]
  pull_request:
    branches: ["production-candidate-v1", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate active prompts
        run: python tests/validate_library.py
