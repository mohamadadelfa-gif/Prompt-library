name: Prompt Library Validation

on:
  push:
    branches: ["v3-controlled-system"]
  pull_request:
    branches: ["v3-controlled-system", "main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active prompts
        run: python tests/validate_library.py
