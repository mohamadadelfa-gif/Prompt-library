name: Prompt Library Validation

on:
  push:
    branches: ["production-candidate-v1"]
  pull_request:
    branches: ["production-candidate-v1", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate active prompts
        run: python tests/validate_library.py

      - name: Validate canonical production process
        run: python tests/validate_process.py

      - name: Validate controlled knowledge registry
        run: python tests/validate_knowledge.py

      - name: Compile runtime and test modules
        run: python -m compileall -q runtime tests

      - name: Validate synthetic fixture and rubric
        run: |
          python - <<'PY'
          from pathlib import Path
          fixture = Path("tests/fixtures/noura_coffee/project_input.md")
          rubric = Path("tests/evaluation_rubric.md")
          assert fixture.exists() and fixture.stat().st_size > 0
          assert rubric.exists() and rubric.stat().st_size > 0
          print("Synthetic semantic-test assets: PASS")
          PY
